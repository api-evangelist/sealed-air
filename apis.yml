aid: sealed-air
name: "Sealed Air"
description: >-
  Sealed Air Corporation (SEE) is a global packaging company headquartered in Charlotte, North
  Carolina, now privately held following its acquisition by Clayton, Dubilier & Rice. It designs
  and manufactures food packaging, protective packaging and automated packaging equipment under
  the Bubble Wrap, Cryovac, AutoBag, Liquibox and NexCel brands, and pairs them with digital
  services including SEE Smart Service Link for connected-equipment monitoring and prismiq for
  digital printing and smart packaging. Its developer surface is an Azure API Management program
  at developer.sealedair.com whose API catalog requires a portal account, so no public OpenAPI,
  reference or SDK is available to an unauthenticated integrator.
